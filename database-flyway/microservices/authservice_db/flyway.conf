flyway.url = jdbc:postgresql://localhost:5432/postgres?options=-c%20timezone=Asia/Kolkata
flyway.user = chatuser
flyway.password = chatpass
# Everything authservice owns lives in its own schema so credential/token
# tables stay isolated from app tables (services connect with
# ?currentSchema=authservice).
flyway.schemas = authservice
flyway.defaultSchema = authservice
flyway.createSchemas = true
flyway.locations = filesystem:./migrations
flyway.baselineOnMigrate = true
