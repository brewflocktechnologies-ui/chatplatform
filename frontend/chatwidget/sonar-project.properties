# SonarQube configuration for the chat widget (Lit web components)
# Server URL and token are read from SONAR_HOST_URL / SONAR_TOKEN env vars
# (or pass -Dsonar.host.url=... -Dsonar.token=... to the sonar script).
# Never commit sonar.token.
sonar.host.url=http://localhost:9000
sonar.projectKey=chatwidget
sonar.projectName=Chat Platform Widget
sonar.projectVersion=1.0.0

sonar.sources=components,config,services,store,tokens,utils,index.ts
sonar.tests=tests
sonar.test.inclusions=tests/**/*.test.ts
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/storybook-static/**,**/test-results/**,**/*.d.ts

sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Mirrors vitest.config.ts: pure types are not measured.
sonar.coverage.exclusions=store/types.ts,**/*.d.ts

sonar.sourceEncoding=UTF-8
