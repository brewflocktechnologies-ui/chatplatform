# SonarQube configuration for the chat widget customization app (Vite + module federation)
# Server URL and token are read from SONAR_HOST_URL / SONAR_TOKEN env vars
# (or pass -Dsonar.host.url=... -Dsonar.token=... to the sonar script).
# Never commit sonar.token.
sonar.host.url=http://localhost:9000
sonar.projectKey=chatwidget-customization
sonar.projectName=Chat Platform Widget Customization
sonar.projectVersion=1.0.0

sonar.sources=src,scripts.js
sonar.tests=tests
sonar.test.inclusions=tests/**/*.test.js
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**

sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Mirrors vitest.config.js: coverage is measured on src/ only.
sonar.coverage.exclusions=scripts.js

sonar.sourceEncoding=UTF-8