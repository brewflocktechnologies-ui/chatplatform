# SonarQube configuration for the chatdashboard app
# Server URL and token are read from SONAR_HOST_URL / SONAR_TOKEN env vars
# (or pass -Dsonar.host.url=... -Dsonar.token=... to the sonar script).
sonar.host.url=http://localhost:9000
sonar.projectKey=chatdashboard
sonar.projectName=Chat Platform Dashboard
sonar.projectVersion=1.0.0

sonar.sources=src
sonar.tests=tests
sonar.test.inclusions=tests/**/*.test.ts,tests/**/*.test.tsx,tests/**/*.spec.ts,tests/**/*.spec.tsx
sonar.exclusions=**/node_modules/**,**/.next/**,**/coverage/**,scripts/**

sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Coverage is measured on the unit-testable logic layer (mirrors
# vitest.config.ts). UI components/pages and live-system infrastructure
# (websocket hub, module federation, MongoDB, next/font, Sentry) are
# covered by the Playwright e2e suite, not by unit coverage.
sonar.coverage.exclusions=**/*.tsx,src/app/**,src/types/**,src/constants/mock-api.ts,src/features/chat/services/**,src/features/widget-modifier/lib/**,src/lib/mongodb.ts,src/components/themes/font.config.ts,src/instrumentation.ts,src/instrumentation-client.ts

sonar.sourceEncoding=UTF-8
sonar.token=squ_e70234d533036c1922501d9039ad81f4f22248b5
