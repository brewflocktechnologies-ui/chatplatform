name: Frontend CI

on:
  pull_request:
    paths:
      - 'frontend/chatwidget/**'
      - 'frontend/chatwidget-customization/**'
      - '.github/workflows/frontend-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'frontend/chatwidget/**'
      - 'frontend/chatwidget-customization/**'
      - '.github/workflows/frontend-ci.yml'

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests (widget)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend/chatwidget

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/chatwidget/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test

  customization:
    name: Unit tests (customization)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend/chatwidget-customization

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/chatwidget-customization/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test

      - name: Build check
        run: npm run build
