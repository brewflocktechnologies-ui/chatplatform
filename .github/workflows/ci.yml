name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          filter: tree:0
          fetch-depth: 0

      # Cache node_modules
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            frontend/chatwidget/package-lock.json

      - run: npm ci

      # frontend/chatwidget keeps its own lockfile outside the npm workspace —
      # install its deps so its nx targets (typecheck/test/build) can resolve
      # modules like 'lit'.
      - run: npm ci --prefix frontend/chatwidget

      - run: npx nx format:check --base="remotes/origin/main"
      - run: npx nx run-many -t lint test build typecheck e2e
