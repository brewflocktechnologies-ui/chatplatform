version: v2
clean: true
managed:
  enabled: true
  # Our own module already carries go_package; keep BSR deps (buf/validate)
  # out of generation entirely - their Go code ships as a library.
  disable:
    - module: buf.build/bufbuild/protovalidate
plugins:
  - local: protoc-gen-go
    out: gen/proto
    opt: module=github.com/chatplatform/allocationservice/gen/proto
  - local: protoc-gen-go-grpc
    out: gen/proto
    opt: module=github.com/chatplatform/allocationservice/gen/proto
