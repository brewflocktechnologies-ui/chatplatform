spring:
  application:
    name: chatdashboardbff
  autoconfigure:
    # This auto-config contributes a DEFAULT catch-all resource-server chain
    # whenever a ReactiveJwtDecoder bean exists - its ConditionalOnDefaultWebSecurity
    # guard only backs off for servlet SecurityFilterChain beans, so our reactive
    # chains don't suppress it (Boot 4.1). The chain is dead at runtime (ours
    # registers first and also matches any exchange) but it carries none of our
    # hardening headers; SecurityConfig owns the real chains.
    exclude:
      - org.springframework.boot.security.oauth2.server.resource.autoconfigure.web.reactive.ReactiveOAuth2ResourceServerWebSecurityAutoConfiguration
  # In-flight dashboard requests get this long to finish on shutdown
  # (pairs with server.shutdown: graceful below).
  lifecycle:
    timeout-per-shutdown-phase: 20s
  profiles:
    # dev by default so BootUI is on with zero extra flags locally - override
    # SPRING_PROFILES_ACTIVE for any real deployment (same convention as the
    # other services).
    active: dev
  grpc:
    client:
      channel:
        accountservice:
          # accountservice's gRPC server (spring.grpc.server.port in its yaml).
          target: static://localhost:9095

# Consumed by ReactiveJwtDecoderConfig (not the
# spring.security.oauth2.resourceserver properties - the explicit decoder adds
# the audience check the property-based one can't do). issuer is the iss claim
# to accept (fixed - tokens always say localhost:8110); only the jwks-uri
# changes per network (compose overrides it to http://authservice:8110/...).
authservice:
  auth:
    issuer: http://localhost:8110
    jwks-uri: http://localhost:8110/oauth2/jwks
    audience: chatplatform-api

server:
  port: 8100
  # Finish in-flight requests before closing instead of cutting them mid-response.
  shutdown: graceful

# Keeps BootUI's own /bootui/api/** controllers out of the generated OpenAPI
# contract - same lesson chatservice learned (244 -> 7803 lines without it).
springdoc:
  paths-to-match: /api/**

management:
  server:
    port: 8101
    address: 127.0.0.1
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
      # Kubernetes-style probe groups. Readiness stays app-internal on
      # purpose: accountservice being down should NOT mark the BFF unready
      # (gRPC channels reconnect lazily; requests fail fast to 503/504 with
      # the deadline) - cascading downstream health into readiness just
      # amplifies outages.
      probes:
        enabled: true
  # The long property names are load-bearing - the shorter management.otlp.
  # {tracing,logging}.* variants are a silent no-op (see AGENTS.md's
  # Observability section).
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/traces
    logging:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/logs
  otlp:
    metrics:
      export:
        url: http://localhost:4318/v1/metrics
  tracing:
    sampling:
      probability: 1.0
