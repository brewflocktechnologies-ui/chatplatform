openapi: 3.1.0
info:
  title: Chatservice API
  description: Tenant management for the chat platform
  version: v1
servers:
- url: http://localhost:8080
  description: Generated server url
tags:
- name: Tenants
  description: "Tenant lifecycle: the tenancy root every other resource keys off of"
paths:
  /api/v1/tenants/{tenantId}:
    get:
      tags:
      - Tenants
      summary: Get a tenant by id
      operationId: get
      parameters:
      - name: tenantId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantResponse"
        "404":
          description: Tenant not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
    put:
      tags:
      - Tenants
      summary: Update a tenant's name/status (slug is immutable)
      operationId: update
      parameters:
      - name: tenantId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantUpdateRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantResponse"
        "400":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          description: Tenant not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
    delete:
      tags:
      - Tenants
      summary: Delete a tenant
      operationId: delete
      parameters:
      - name: tenantId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: Deleted
        "404":
          description: Tenant not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /api/v1/tenants:
    get:
      tags:
      - Tenants
      summary: List tenants (paginated)
      operationId: list
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PagedModelTenantResponse"
    post:
      tags:
      - Tenants
      summary: Create a tenant
      operationId: create
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantResponse"
        "400":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "409":
          description: Slug already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
components:
  schemas:
    TenantUpdateRequest:
      type: object
      properties:
        name:
          type: string
          example: Acme Corp
          maxLength: 255
          minLength: 0
        status:
          type: string
          enum:
          - ACTIVE
          - SUSPENDED
      required:
      - name
      - status
    ProblemDetail:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        instance:
          type: string
          format: uri
        properties:
          type: object
          additionalProperties:
            type: object
    TenantResponse:
      type: object
      properties:
        tenantId:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        status:
          type: string
          enum:
          - ACTIVE
          - SUSPENDED
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        createdBy:
          type: string
        updatedBy:
          type: string
        version:
          type: integer
          format: int64
    TenantRequest:
      type: object
      properties:
        slug:
          type: string
          description: "Globally unique, lowercase, becomes a NATS subject segment"
          example: acme-corp
          pattern: "^[a-z0-9-]{3,32}$"
        name:
          type: string
          example: Acme Corp
          maxLength: 255
          minLength: 0
        status:
          type: string
          description: Defaults to ACTIVE when omitted
          enum:
          - ACTIVE
          - SUSPENDED
      required:
      - name
      - slug
    PageMetadata:
      type: object
      properties:
        size:
          type: integer
          format: int64
        number:
          type: integer
          format: int64
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int64
    PagedModelTenantResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/TenantResponse"
        page:
          $ref: "#/components/schemas/PageMetadata"
